name: Telegram design bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# each run keeps listening for 25 minutes; the next scheduled run waits in the queue and takes over
concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow anthropic
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install renderer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
          cd template && npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Answer customers for 25 minutes
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: python bot/bot.py 25
